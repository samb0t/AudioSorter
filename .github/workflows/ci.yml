name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon, like the beta's only target.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build with detection
        run: zsh build.sh --detect

      # Fail rather than let the detection tests skip silently.
      - name: Check detection is enabled
        run: test -f "Audio Sorter.app/Contents/Resources/detect-model"

      - name: Run tests
        run: .venv/bin/python -m unittest -v

      - name: Build the release app
        run: zsh build.sh --release

      - name: Check the release app
        run: .venv/bin/python -m unittest -v tests.test_release
        env:
          AUDIO_SORTER_RELEASE_APP: .build/release/Audio Sorter.app
